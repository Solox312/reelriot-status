# /etc/nginx/sites-available/reelriot-status
# Production Nginx reverse proxy configuration for status.reelriot.app
# Target Product: ReelRiot Status (Next.js 16 Standalone on 127.0.0.1:3003)

# ==============================================================================
# Port 80 HTTP Server: Redirect to HTTPS + ACME Challenge Handling
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name status.reelriot.app;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# Port 443 HTTPS Server: Reverse Proxy + Static Asset Caching + TLS Termination
# NOTE: Only activate this block after running certbot to generate certificates!
# ==============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name status.reelriot.app;

    # TLS Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/status.reelriot.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/status.reelriot.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_RRSTATUS:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip Compression for Next.js payloads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Next.js Static Assets (_next/static/*)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static Public Assets
    location /public/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Main Application & API Reverse Proxy
    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;

        # WebSockets & Server-Sent Events (SSE) support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Client Identity Forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Streaming Buffer Tuning
        proxy_max_temp_file_size 0;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
